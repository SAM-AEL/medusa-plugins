name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        run: yarn install --immutable

      - name: Build plugins
        run: yarn workspaces foreach -A run build

      - name: Mailer built runtime smoke test
        run: yarn check:mailer-build

      - name: Generic branding check
        run: yarn check:generic-branding

      - name: Typecheck
        run: yarn typecheck

      - name: Tests
        run: yarn test

      - name: Audit (yarn)
        run: yarn npm audit --recursive

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
