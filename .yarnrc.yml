# Yarn 4 settings for the monorepo root.
#
# Every workspace already declares `nodeLinker: node-modules`, but the root
# package had no .yarnrc.yml, so Yarn fell back to its default Plug'n'Play mode.
# Under PnP, .pnp.cjs hooks CommonJS require(), and Node's test runner loading the
# TypeScript test files via require() triggered ERR_REQUIRE_CYCLE_MODULE. Pinning
# the linker here makes the root agree with its workspaces.
nodeLinker: node-modules

enableGlobalCache: false